# CardioVision AI - Full-Stack Local & Server Hosting
# Run with: docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: cardiovision-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/cardiovision.db
      - ARTIFACTS_DIR=/app/artifacts
      - AUTO_CREATE_TABLES=false
      - API_TOKEN=${API_TOKEN:-}
      - ALLOWED_ORIGINS=["http://localhost","http://localhost:80","http://localhost:8080","http://localhost:3000","http://localhost:5173","http://127.0.0.1","http://127.0.0.1:80","http://127.0.0.1:8080"]
    volumes:
      - cardiovision-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - cardiovision-net

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: cardiovision-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cardiovision-net

volumes:
  cardiovision-data:
    name: cardiovision-data

networks:
  cardiovision-net:
    name: cardiovision-net
