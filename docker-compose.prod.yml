# ==============================================================================
# CardioVision AI - Production Stack with Nginx Reverse Proxy
# Ideal for VPS / Cloud Server hosting (AWS EC2, DigitalOcean, Hetzner, Linode)
# Run with: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: cardiovision-prod-backend
    restart: always
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/cardiovision.db}
      - ARTIFACTS_DIR=/app/artifacts
      - AUTO_CREATE_TABLES=false
      - API_TOKEN=${API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost","http://localhost:80","https://localhost"]}
    volumes:
      - cardiovision-prod-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - cardiovision-prod-net

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: cardiovision-prod-frontend
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - cardiovision-prod-net

volumes:
  cardiovision-prod-data:
    name: cardiovision-prod-data

networks:
  cardiovision-prod-net:
    name: cardiovision-prod-net
