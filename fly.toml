# Fly.io Launch Configuration for CardioVision AI
# Deploy with: fly launch && fly deploy
app = "cardiovision-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  SERVE_FRONTEND = "true"
  DATABASE_URL = "sqlite:////app/data/cardiovision.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[mounts]
  source = "cardiovision_data"
  destination = "/app/data"
  initial_size = "1gb"
